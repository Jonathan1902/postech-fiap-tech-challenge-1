[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "churn_predictor"
version = "1.0.0"
description = "Telco churn prediction API"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "PL"]
ignore = ["PLR2004", "N803", "N806", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"

[tool.coverage.run]
source = ["src/churn_predictor"]
omit = ["*/__init__.py"]

[tool.coverage.report]
fail_under = 85
show_missing = true
