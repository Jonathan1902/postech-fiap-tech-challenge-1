<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Churn Predictor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f5f5; color: #333; padding: 2rem; }
    h1 { margin-bottom: 1.5rem; color: #1a1a2e; }
    form { background: white; padding: 1.5rem; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.1); max-width: 700px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    label { display: flex; flex-direction: column; font-size: .85rem; gap: .3rem; }
    input, select { padding: .4rem .6rem; border: 1px solid #ccc; border-radius: 4px; font-size: .9rem; }
    button { margin-top: 1.2rem; padding: .6rem 1.4rem; background: #1a1a2e; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
    button:hover { background: #16213e; }
    #result { margin-top: 1.5rem; max-width: 700px; }
    .card { background: white; border-radius: 8px; padding: 1.2rem; box-shadow: 0 2px 8px rgba(0,0,0,.1); }
    .prob { font-size: 2rem; font-weight: bold; }
    .churn-yes { color: #c0392b; }
    .churn-no  { color: #27ae60; }
    .contributors { margin-top: 1rem; }
    .contributors table { width: 100%; border-collapse: collapse; font-size: .85rem; }
    .contributors th, .contributors td { text-align: left; padding: .4rem .6rem; border-bottom: 1px solid #eee; }
    pre { background: #f0f0f0; padding: 1rem; border-radius: 4px; font-size: .8rem; overflow-x: auto; margin-top: 1rem; }
    .error { color: #c0392b; background: #fdecea; padding: .8rem; border-radius: 4px; margin-top: 1rem; }
  </style>
</head>
<body>
  <h1>🔮 Churn Predictor</h1>
  <form id="form">
    <div class="grid">
      <label>Tenure Months
        <input name="Tenure Months" type="number" min="0" max="72" value="12" required />
      </label>
      <label>Monthly Charges
        <input name="Monthly Charges" type="number" step="0.01" min="0.01" value="65.00" required />
      </label>
      <label>Total Charges
        <input name="Total Charges" type="number" step="0.01" min="0" value="780.00" required />
      </label>
      <label>Senior Citizen
        <select name="Senior Citizen">
          <option>No</option><option>Yes</option>
        </select>
      </label>
      <label>Partner
        <select name="Partner"><option>No</option><option>Yes</option></select>
      </label>
      <label>Dependents
        <select name="Dependents"><option>No</option><option>Yes</option></select>
      </label>
      <label>Multiple Lines
        <select name="Multiple Lines"><option>No</option><option>Yes</option></select>
      </label>
      <label>Internet Service
        <select name="Internet Service">
          <option>DSL</option><option>Fiber optic</option><option>No</option>
        </select>
      </label>
      <label>Online Security
        <select name="Online Security"><option>No</option><option>Yes</option></select>
      </label>
      <label>Online Backup
        <select name="Online Backup"><option>No</option><option>Yes</option></select>
      </label>
      <label>Device Protection
        <select name="Device Protection"><option>No</option><option>Yes</option></select>
      </label>
      <label>Tech Support
        <select name="Tech Support"><option>No</option><option>Yes</option></select>
      </label>
      <label>Streaming TV
        <select name="Streaming TV"><option>No</option><option>Yes</option></select>
      </label>
      <label>Streaming Movies
        <select name="Streaming Movies"><option>No</option><option>Yes</option></select>
      </label>
      <label>Contract
        <select name="Contract">
          <option>Month-to-month</option>
          <option>One year</option>
          <option>Two year</option>
        </select>
      </label>
      <label>Paperless Billing
        <select name="Paperless Billing"><option>No</option><option>Yes</option></select>
      </label>
      <label>Payment Method
        <select name="Payment Method">
          <option>Electronic check</option>
          <option>Mailed check</option>
          <option>Bank transfer (automatic)</option>
          <option>Credit card (automatic)</option>
        </select>
      </label>
    </div>
    <button type="submit">Predict</button>
  </form>

  <div id="result"></div>

  <script>
    document.getElementById('form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const data = Object.fromEntries(new FormData(e.target));
      data['Tenure Months'] = parseInt(data['Tenure Months']);
      data['Monthly Charges'] = parseFloat(data['Monthly Charges']);
      data['Total Charges'] = parseFloat(data['Total Charges']);

      const resultDiv = document.getElementById('result');
      try {
        const resp = await fetch('/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        if (!resp.ok) {
          const err = await resp.json();
          resultDiv.innerHTML = `<div class="error"><strong>Erro ${resp.status}:</strong><pre>${JSON.stringify(err, null, 2)}</pre></div>`;
          return;
        }
        const r = await resp.json();
        const cls = r.churn_prediction ? 'churn-yes' : 'churn-no';
        const label = r.churn_prediction ? '⚠️ Churn' : '✅ Retido';
        const rows = r.top_contributors.map(c => {
          const impact = c.contribution > 0 ? '▲' : '▼';
          const color  = c.contribution > 0 ? '#c0392b' : '#27ae60';
          return `<tr>
            <td>${c.feature_label}</td>
            <td style="color:${color};font-weight:600">${impact} ${c.direction}</td>
            <td style="text-align:right;font-variant-numeric:tabular-nums">${c.contribution.toFixed(3)}</td>
          </tr>`;
        }).join('');
        resultDiv.innerHTML = `
          <div class="card">
            <div class="prob ${cls}">${(r.churn_probability * 100).toFixed(1)}% — ${label}</div>
            <p style="margin-top:.5rem;color:#666">${r.decision_reason}</p>
            <p style="margin-top:.3rem;font-size:.8rem;color:#999">Threshold: ${r.threshold} | Modelo: ${r.model_version}</p>
            <div class="contributors">
              <strong>Principais fatores</strong>
              <table>
                <thead><tr><th>Fator</th><th>Impacto</th><th style="text-align:right">Peso</th></tr></thead>
                <tbody>${rows}</tbody>
              </table>
            </div>
          </div>`;
      } catch(err) {
        resultDiv.innerHTML = `<div class="error">${err}</div>`;
      }
    });
  </script>
</body>
</html>
